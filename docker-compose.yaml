services:
  postiz:
    image: ghcr.io/abdulameen962/postiz-app:latest
    container_name: postiz
    restart: always
    env_file:
      - .env
    environment:
      # Cap each Node process (Frontend, Backend, Orchestrator) so they don't OOM kill port 3000
      - NODE_OPTIONS=--max-old-space-size=768
      - TEMPORAL_ADDRESS=temporal:7233
      - REDIS_URL=redis://postiz-redis:6379
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      - '4007:5000'
    networks:
      - postiz-network
    depends_on:
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-redis:
    image: redis:7.2-alpine
    container_name: postiz-redis
    restart: always
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  temporal-postgresql:
    container_name: temporal-postgresql
    image: postgres:16-alpine
    restart: always
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c max_connections=50
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    networks:
      - postiz-network
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.28.1
    restart: always
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
      - TEMPORAL_NAMESPACE=default
    networks:
      - postiz-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

volumes:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-pg-data:

networks:
  postiz-network:
    driver: bridge